<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários de Teste</h1>

    <h2>(a) Cadastro de Cliente - Academia</h2>
    <form action="/receptor" method="POST">
        <label>Nome:
            <input type="text" name="nome" required>
        </label>
        <br>
        <label>Email:
            <input type="email" name="email" required>
        </label>
        <br>
        <label>Telefone:
            <input type="tel" name="telefone" required>
        </label>
        <br>
        <button type="submit">Cadastrar</button>
    </form>

    <h2>(b) Entrada de Estoque - Produto</h2>
    <form action="/receptor" method="POST">
        <label>Código do Produto:
            <input type="text" name="codigoP" required>
        </label>
        <br>
        <label>Quantidade:
            <input type="number" name="quantidade" required>
        </label>
        <br>
        <label>Data de Abastecimento:
            <input type="date" name="dataAbastecimento" required>
        </label>
        <br>
        <button type="submit">Registrar Entrada</button>
    </form>

    <h2>(c) Carrinho de Compras - Remover Produto</h2>
    <form action="/receptor" method="POST">
        <label>Código do Produto:
            <input type="text" name="codigoRemover" required>
        </label>
        <br>
        <button type="submit">Remover do Carrinho</button>
    </form>

    <br>
    <a href="/">Voltar</a>
</body>
</html>
